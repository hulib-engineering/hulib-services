name: Build & Deploy to Azure

on:
  workflow_call:
    inputs:
      acr-name:
        type: string
        required: true
      image-name:
        type: string
        required: true
      resource-group:
        type: string
        required: true
      container-app-name:
        type: string
        required: true
      tag:
        type: string
        required: true
      stable-tag:
        type: string
        required: true
      environment:
        type: string
        required: true
    secrets:
      azure-client-id:
        required: true
      azure-tenant-id:
        required: true
      azure-subscription-id:
        required: true

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure-client-id }}
          tenant-id: ${{ secrets.azure-tenant-id }}
          subscription-id: ${{ secrets.azure-subscription-id }}

      # Builds inside ACR itself, no local Docker daemon needed.
      # Uses Dockerfile.azure (npm ci --> prisma generate --> nest build --> start:prod),
      # which has no dotenvx - config comes from Key Vault-backed Container App secrets/env vars.
      - name: Build and push image
        run: |
          az acr build \
            --registry ${{ inputs.acr-name }} \
            --image ${{ inputs.image-name }}:${{ inputs.tag }} \
            --image ${{ inputs.image-name }}:${{ inputs.stable-tag }} \
            --file Dockerfile.azure \
            .

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ inputs.container-app-name }} \
            --resource-group ${{ inputs.resource-group }} \
            --image ${{ inputs.acr-name }}.azurecr.io/${{ inputs.image-name }}:${{ inputs.tag }}